<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f1" />
    <title>SPOTi — Ljubljana živi tukaj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4Z"></path></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 22a8 8 0 0 1 16 0"></path></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"></path><path d="M9 3v15M15 6v15"></path></symbol>
      <symbol id="i-location" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"></path></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></symbol>
      <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 9a3 3 0 0 0 0 6v4h18v-4a3 3 0 0 0 0-6V5H3Z"></path><path d="M13 5v3M13 11v2M13 16v3"></path></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></symbol>
      <symbol id="i-navigation" viewBox="0 0 24 24"><path d="m12 3 7 18-7-4-7 4Z"></path></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"></path><path d="M5 10v11h14V10M9 21v-7h6v7"></path></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5Z"></path></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"></path></symbol>
    </svg>

    <div id="app" class="app-shell">
      <aside class="desktop-rail" aria-label="Glavna navigacija">
        <button class="brand" data-action="welcome" aria-label="SPOTi domov"><span>SP</span><i></i><span>Ti</span></button>
        <div class="rail-links">
          <button class="rail-link active" data-screen="home"><svg><use href="#i-home"></use></svg><span>Domov</span></button>
          <button class="rail-link" data-screen="explore"><svg><use href="#i-compass"></use></svg><span>Explore</span></button>
          <button class="rail-link" data-screen="map"><svg><use href="#i-map"></use></svg><span>Zemljevid</span></button>
          <button class="rail-link" data-screen="calendar"><svg><use href="#i-calendar"></use></svg><span>Koledar</span></button>
          <button class="rail-link" data-screen="saved"><svg><use href="#i-bookmark"></use></svg><span>Shranjeno</span></button>
          <button class="rail-link" data-screen="profile"><svg><use href="#i-user"></use></svg><span>Profil</span></button>
        </div>
        <button class="mini-avatar" data-screen="profile" aria-label="Odpri profil">S</button>
      </aside>

      <main class="screen-stage" id="screen-stage"></main>

      <nav class="mobile-nav" aria-label="Glavna navigacija">
        <button class="nav-item active" data-screen="home"><svg><use href="#i-home"></use></svg><span>Domov</span></button>
        <button class="nav-item" data-screen="explore"><svg><use href="#i-compass"></use></svg><span>Explore</span></button>
        <button class="nav-item" data-screen="map"><svg><use href="#i-map"></use></svg><span>Zemljevid</span></button>
        <button class="nav-item" data-screen="calendar"><svg><use href="#i-calendar"></use></svg><span>Koledar</span></button>
        <button class="nav-item" data-screen="profile"><svg><use href="#i-user"></use></svg><span>Profil</span></button>
      </nav>
    </div>

    <div class="overlay-root" id="overlay-root"></div>
    <div id="ai-agent-root"></div>
    <button class="ai-fab" id="ai-fab" aria-label="Odpri SPOTi AI"><span>✦</span><b>SPOTi AI</b></button>
    <div class="toast" id="toast" role="status"></div>
    <script src="events-data.js"></script>
    <script src="ai-agent.js"></script>
    <script src="app.js"></script>
  </body>
</html>
